name: Publish unsigned IPA
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build IPA run ID
        required: true
        default: "42339536555"
        type: string
      tag:
        description: Draft unsigned prerelease tag
        required: true
        default: v0.1.0-unsigned.1
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check artifact source and draft target
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-unsigned\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .name)" = 'Build IPA'
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
          target_sha=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          test "$source_sha" = "$target_sha"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AlphaArc-unsigned-iphoneos
          path: ipa
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Validate device package and compute checksum
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, plistlib, struct, hashlib
          p = pathlib.Path('ipa/AlphaArc-unsigned.ipa')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              info = plistlib.loads(z.read('Payload/SailBrowser.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.yoyovich.alphaarc'
              assert info['CFBundleDisplayName'] == 'AlphaArc'
              assert info['SailCloudSyncEnabled'] == 'NO'
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              data = z.read('Payload/SailBrowser.app/' + info['CFBundleExecutable'])
              header = struct.unpack_from('<8I', data)
              assert header[0] == 0xfeedfacf and header[1] == 0x100000c
              offset, platform = 32, None
              for _ in range(header[4]):
                  command, size = struct.unpack_from('<II', data, offset)
                  if command == 0x32:
                      platform = struct.unpack_from('<I', data, offset + 8)[0]
                  offset += size
              assert platform == 2
          p.with_suffix('.ipa.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY
      - name: Upload and publish explicitly unsigned prerelease
        run: |
          gh release upload "$RELEASE_TAG" ipa/AlphaArc-unsigned.ipa ipa/AlphaArc-unsigned.ipa.sha256 -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
